[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fh-liteformer"
version = "1.0.0"
description = "Frozen FH-LiteFormer C-r8 models and staged experiment reproduction"
readme = "README.md"
license = {file = "LICENSE"}
authors = [{name = "Jiajun Ma"}]
requires-python = ">=3.10,<3.13"
dependencies = ["numpy==1.26.4", "pandas==2.2.2", "pyarrow==16.1.0", "torch==2.3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fh_liteformer = ["configs/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

